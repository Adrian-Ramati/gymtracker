name: Informe semanal Peak Physique

on:
  schedule:
    # Se dispara dos veces cada domingo (17:00 y 18:00 UTC) para cubrir
    # tanto horario de verano como de invierno en España.
    # El script comprueba la hora real en Madrid y solo actúa a las 19:00.
    - cron: '0 17 * * 0'
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar envío ahora mismo (ignora la comprobación de las 19:00)'
        week_offset:
        description: 'Semanas hacia atrás (0 = actual, -1 = semana pasada)'
        type: string
        default: '0'
        type: boolean
        default: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install --prefix scripts

      - name: Generar y enviar informe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          WEEK_OFFSET: ${{ inputs.week_offset }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          FORCE_SEND: ${{ inputs.force }}
        run: node scripts/weekly-report.mjs
